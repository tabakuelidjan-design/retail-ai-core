<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Références du test (LAB)</title>
<style>
:root{--bg:#f6f3ef;--ink:#1b2433;--muted:#64605d;--navy:#10223b;--card:#fdfbf8;--line:#e5ded5;--ok:#2e7d4f}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:14px 16px 100px}
h1{font:700 21px/1.2 Georgia,serif;margin:4px 0 2px}.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
button{font:600 17px system-ui;border:0;border-radius:14px;padding:14px 16px;min-height:52px;margin:6px 6px 6px 0;background:#ece8e5;color:var(--ink)}button.go{background:var(--navy);color:#fff}
textarea{width:100%;min-height:120px;font:16px/1.4 system-ui;padding:10px;border:1px solid var(--line);border-radius:10px}
.cat{font:700 11px system-ui;letter-spacing:.08em;color:#9a5b00}.small{font-size:13px;color:var(--muted)}
</style></head>
<body>
<h1>Texte de référence de la conversation naturelle</h1>
<p class="sub">Écoute chaque passage et écris EXACTEMENT ce que tu as dit (mots, chiffres, références). Sans référence, la parole naturelle n'est pas notée. Les phrases contrôlées n'ont pas besoin de texte : elles sont notées sur les faits attendus.</p>
<div id="stage">chargement…</div>
<script type="module" src="ref.js"></script>
</body></html>
