<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14263f">
<meta name="color-scheme" content="light dark">
<title>Nordla Achats</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <button id="back" class="ghost" aria-label="Retour" hidden>‹</button>
  <div class="title"><strong id="title">Achats</strong><span id="subtitle" class="muted"></span></div>
  <span id="net" class="badge b-live">En ligne</span>
</header>
<div id="offline" class="banner err" role="alert" hidden><span id="offline-text"></span> <button id="offline-retry" class="linkbtn">Réessayer</button></div>
<div id="banner" class="banner" role="status" hidden></div>
<main id="main" tabindex="-1"></main>
<nav class="tabs" aria-label="Navigation">
  <button data-tab="visits">Visites</button>
  <button data-tab="items">Produits</button>
  <button data-tab="compare">Comparer</button>
  <button data-tab="orders">Achats</button>
  <button data-tab="stock">Stock</button>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
