<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14263f">
<meta name="color-scheme" content="light dark">
<title>Nordla Achats</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/nordla-core-rail.css">
<link rel="stylesheet" href="app.css">
<script src="/nordla-core-rail.js" defer></script>
</head>
<body>
<div class="shell">
<div data-nordla-core-rail="procurement"></div>
<div class="mainarea">
<header class="top">
  <span data-nordla-core-toggle></span>
  <button id="back" class="ghost" aria-label="Retour" hidden>‹</button>
  <div class="title"><strong id="title">Achats</strong><span id="subtitle" class="muted"></span></div>
  <a id="nordla-home" class="homelink" hidden>Accueil Nordla</a><span id="net" class="badge b-live">En ligne</span>
</header>
<div id="offline" class="banner err" role="alert" hidden><span id="offline-text"></span> <button id="offline-retry" class="linkbtn">Réessayer</button></div>
<div id="banner" class="banner" role="status" hidden></div>
<nav class="tabs" aria-label="Navigation">
  <button data-tab="visits"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 10h16M8 14h3m-3 3h6"/></svg><span>Visites</span></button>
  <button data-tab="items"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg><span>Produits</span></button>
  <button data-tab="compare"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 19h16M6 16l4-5 3 2 5-7"/><circle cx="6" cy="16" r="1"/><circle cx="10" cy="11" r="1"/><circle cx="13" cy="13" r="1"/><circle cx="18" cy="6" r="1"/></svg><span>Comparer</span></button>
  <button data-tab="orders"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 4h14v17l-2-1-2 1-3-1-3 1-2-1-2 1z"/><path d="M8 9h8m-8 4h8m-8 4h5"/></svg><span>Achats</span></button>
  <button data-tab="stock"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9M8 5l8 4.5"/></svg><span>Stock</span></button>
</nav>
<main id="main" tabindex="-1"></main>
</div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
