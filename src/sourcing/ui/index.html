<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<meta name="referrer" content="no-referrer">
<title>Nordla - Sourcing</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nordla">
<style>
html, body { min-height: 100%; background: #f4f5f7; }
body.ui-booting .mainarea > header.top, body.ui-booting .mainarea > #statusbar { display: none; }
body.ui-booting .mainarea > #screen, body.ui-booting .mainarea > #tabs { visibility: hidden; }
</style>
<link rel="stylesheet" href="/nordla-core-rail.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/field.css">
<link rel="stylesheet" href="/salon.css">
<link rel="stylesheet" href="/nx.css">
<link rel="stylesheet" href="/nordla-home.css">
  <style>body.core-signed-out .mainarea > header.top, body.core-signed-out .mainarea > #statusbar, body.core-signed-out #btn-cases, body.core-signed-out #case-name, body.core-signed-out #case-sub, body.core-signed-out #mode { display: none; }</style>
</head>
<body class="ui-booting">
<div class="shell">
  <div data-nordla-core-rail-slot></div>
  <div class="mainarea">
    <header class="top">
      <span data-nordla-core-toggle-slot></span>
      <button class="ghost" id="btn-cases" aria-label="Dossiers">&#9636;</button>
      <div class="title"><strong id="case-name">Sourcing</strong><span id="case-sub" class="muted"></span></div>
      <span id="mode" class="badge"></span>
    </header>
    <div id="statusbar" class="statusbar" aria-live="polite"></div>
    <main id="screen" tabindex="-1"></main>
    <nav class="tabs" id="tabs" aria-label="Navigation principale"></nav>
    <div id="overlay" hidden></div>
  </div>
</div>
<script>
  var railSlot = document.querySelector('[data-nordla-core-rail-slot]');
  var toggleSlot = document.querySelector('[data-nordla-core-toggle-slot]');
  if (/^\/sourcing\/?$/.test(window.location.pathname)) {
    document.body.classList.add('nordla-hosted');
    if (railSlot) railSlot.setAttribute('data-nordla-core-rail', 'sourcing');
    if (toggleSlot) toggleSlot.setAttribute('data-nordla-core-toggle', '');
  }
</script>
<script src="/nordla-core-rail.js"></script>
<noscript>This tool needs JavaScript.</noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
