<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" role="img" aria-labelledby="title desc">
  <title id="title">Nordla Core — quatre piliers</title>
  <desc id="desc">Agents IA, Données sécurisées, Outils connectés et Règles et validations autour du logo Nordla. Fond extérieur transparent.</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-25%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#152033" flood-opacity=".10"/>
    </filter>
    <filter id="medallionShadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#9d6d2b" flood-opacity=".13"/>
    </filter>
  </defs>

  <!-- Orbites et repères -->
  <circle cx="230" cy="190" r="154" fill="none" stroke="#c58b3b" stroke-width="1" stroke-dasharray="1.4 4.4" stroke-linecap="round" opacity=".62"/>
  <circle cx="230" cy="190" r="132" fill="none" stroke="#c58b3b" stroke-width="1" opacity=".52"/>
  <g fill="#b77b2b">
    <circle cx="230" cy="35" r="2.7"/><circle cx="339" cy="81" r="2.7"/>
    <circle cx="385" cy="190" r="2.7"/><circle cx="339" cy="299" r="2.7"/>
    <circle cx="230" cy="345" r="2.7"/><circle cx="121" cy="299" r="2.7"/>
    <circle cx="75" cy="190" r="2.7"/><circle cx="121" cy="81" r="2.7"/>
  </g>

  <!-- Liaisons -->
  <g fill="none" stroke="#b77b2b" stroke-width="1.5" stroke-linecap="round">
    <path d="M230 85v40"/><path d="M149 193h14"/><path d="M297 193h5"/><path d="M230 257v38"/>
  </g>

  <!-- Médaillon central -->
  <circle cx="230" cy="190" r="78" fill="#b77b2b" opacity=".06"/>
  <circle cx="230" cy="190" r="70" fill="#fff" stroke="#b77b2b" stroke-width="1.8" filter="url(#medallionShadow)"/>
  <text x="230" y="211" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="400" fill="#ad762d">N</text>

  <!-- Carte Agents IA -->
  <g filter="url(#cardShadow)">
    <rect x="160" y="25" width="140" height="60" rx="14" fill="#fff" stroke="#e0e5ec"/>
    <rect x="171" y="35" width="40" height="40" rx="11" fill="#b17a2d"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="185" cy="49" r="2.4"/><circle cx="193" cy="50" r="2.1"/>
    <path d="M180.5 60c.5-3.4 2.1-5 4.6-5s4.1 1.6 4.6 5M190.5 56c2.2-.2 3.6 1.1 4 3.6"/>
  </g>
  <text x="220" y="52" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">Agents IA</text>
  <text x="220" y="68" font-family="Arial, sans-serif" font-size="11" fill="#536278">Orchestration</text>

  <!-- Carte Données -->
  <g filter="url(#cardShadow)">
    <rect x="9" y="164" width="140" height="59" rx="14" fill="#fff" stroke="#e0e5ec"/>
    <rect x="20" y="174" width="39" height="39" rx="11" fill="#14584f"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="39.5" cy="184.5" rx="6.2" ry="2.8"/><path d="M33.3 184.5v11c0 1.6 2.8 2.9 6.2 2.9s6.2-1.3 6.2-2.9v-11"/>
    <path d="M33.3 190c0 1.6 2.8 2.9 6.2 2.9s6.2-1.3 6.2-2.9"/>
  </g>
  <text x="68" y="189" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">Données</text>
  <text x="68" y="206" font-family="Arial, sans-serif" font-size="11" fill="#536278">Sécurisées</text>

  <!-- Carte Outils -->
  <g filter="url(#cardShadow)">
    <rect x="302" y="164" width="136" height="59" rx="14" fill="#fff" stroke="#e0e5ec"/>
    <rect x="313" y="174" width="39" height="39" rx="11" fill="#aa742d"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M332.5 184a5 5 0 0 0 6.6 6.6l-5.4 5.4-3.2-3.2 5.4-5.4a5 5 0 0 0 6.6-6.6l-3.1 3.1-3.2-3.2z"/>
  </g>
  <text x="362" y="189" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">Outils</text>
  <text x="362" y="206" font-family="Arial, sans-serif" font-size="11" fill="#536278">Connectés</text>

  <!-- Carte Règles -->
  <g filter="url(#cardShadow)">
    <rect x="160" y="295" width="140" height="60" rx="14" fill="#fff" stroke="#e0e5ec"/>
    <rect x="171" y="305" width="40" height="40" rx="11" fill="#14584f"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M191 316l6 2.2v5.1c0 4.3-2.7 6.8-6 8.4-3.3-1.6-6-4.1-6-8.4v-5.1z"/>
    <path d="m188.5 323.5 1.8 1.8 3.5-3.8"/>
  </g>
  <text x="220" y="322" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">Règles</text>
  <text x="220" y="339" font-family="Arial, sans-serif" font-size="11" fill="#536278">et validations</text>
</svg>
