name: Creative Intelligence V1

# PRE-C2 adds the common resource resolver, Brand Memory V1.1, real typography (HarfBuzz WASM) and the resvg PNG path (native prebuilt binary):
# the suites run on Node 20 and 24. C1 foundation (and its real Marketing M3 integration test, which builds the Marketing / Branding chain): DesignDocument, deterministic layout / typography / SVG renderer, preflight, hard-gate selection and the contracts of the
# agents and of the provider registry. It consumes only shared pure validators of Marketing and the Branding content-kind constant, so the
# focused suite runs first (fast diagnosis), then Branding + Creative Fidelity + Marketing + Creative Intelligence together, then the whole
# suite for cross-domain non-regression. No network, no model, no provider credential: every test is deterministic.

on:
  push:
    paths:
      - 'src/creative-intelligence/**'
      - 'test/creative-intelligence*.test.js'
      - 'test/creative-intelligence-fixtures.js'
      - 'test/creative-intelligence-m3-world.js'
      - 'docs/architecture/creative-intelligence-v1.md'
      - 'benchmarks/creative-intelligence/**'
      - 'NORDLA-DECISION-REGISTER.md'
      - 'src/marketing/**'
      - 'src/branding/**'
      - 'src/resources/**'
      - 'schemas/branding/**'
      - 'test/fixtures/fonts/**'
      - 'test/resources*.test.js'
      - 'test/branding*.test.js'
      - 'test/branding-v11-world.js'
      - 'THIRD_PARTY_NOTICES.md'
      - 'scripts/build-benchmark-brand-package.mjs'
      - 'scripts/benchmark-resources.mjs'
      - 'scripts/run-benchmark-001.mjs'
      - 'test/fidelity-measurement-world.js'
      - 'test/identity-preserve-world.js'
      - 'src/creative-runtime/**'
      - 'src/creative-critic/**'
      - 'test/creative-critic.test.js'
      - 'test/creative-revision.test.js'
      - 'scripts/run-c3-revision.mjs'
      - 'scripts/run-c3-critic.mjs'
      - 'docs/architecture/creative-c3-critic.md'
      - 'test/runtime-world.js'
      - 'scripts/run-c2-habb-creative.mjs'
      - 'docs/architecture/creative-c2c-product-preserving-runtime.md'
      - 'src/marketing-creative/alibaba/**'
      - 'scripts/run-c2-habb-edit.mjs'
      - 'docs/architecture/creative-c2b-qwen-image-edit.md'
      - 'docs/architecture/creative-c2a-identity-preserve.md'
      - 'resources/fonts/**'
      - 'docs/architecture/creative-pre-c2-foundation.md'
      - 'docs/architecture/socle-resource-resolver-v1.md'
      - 'docs/architecture/branding-v1-contract.md'
      - 'src/creative-fidelity/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/creative-intelligence-v1.yml'
  pull_request:
    paths:
      - 'src/creative-intelligence/**'
      - 'test/creative-intelligence*.test.js'
      - 'test/creative-intelligence-fixtures.js'
      - 'test/creative-intelligence-m3-world.js'
      - 'docs/architecture/creative-intelligence-v1.md'
      - 'benchmarks/creative-intelligence/**'
      - 'NORDLA-DECISION-REGISTER.md'
      - 'src/marketing/**'
      - 'src/branding/**'
      - 'src/resources/**'
      - 'schemas/branding/**'
      - 'test/fixtures/fonts/**'
      - 'test/resources*.test.js'
      - 'test/branding*.test.js'
      - 'test/branding-v11-world.js'
      - 'THIRD_PARTY_NOTICES.md'
      - 'scripts/build-benchmark-brand-package.mjs'
      - 'scripts/benchmark-resources.mjs'
      - 'scripts/run-benchmark-001.mjs'
      - 'test/fidelity-measurement-world.js'
      - 'test/identity-preserve-world.js'
      - 'src/creative-runtime/**'
      - 'src/creative-critic/**'
      - 'test/creative-critic.test.js'
      - 'test/creative-revision.test.js'
      - 'scripts/run-c3-revision.mjs'
      - 'scripts/run-c3-critic.mjs'
      - 'docs/architecture/creative-c3-critic.md'
      - 'test/runtime-world.js'
      - 'scripts/run-c2-habb-creative.mjs'
      - 'docs/architecture/creative-c2c-product-preserving-runtime.md'
      - 'src/marketing-creative/alibaba/**'
      - 'scripts/run-c2-habb-edit.mjs'
      - 'docs/architecture/creative-c2b-qwen-image-edit.md'
      - 'docs/architecture/creative-c2a-identity-preserve.md'
      - 'resources/fonts/**'
      - 'docs/architecture/creative-pre-c2-foundation.md'
      - 'docs/architecture/socle-resource-resolver-v1.md'
      - 'docs/architecture/branding-v1-contract.md'
      - 'src/creative-fidelity/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/creative-intelligence-v1.yml'

permissions:
  contents: read

jobs:
  creative-intelligence-v1-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Focused Creative Intelligence tests
        run: node --test test/creative-intelligence*.test.js test/creative-critic.test.js test/creative-revision.test.js test/resources*.test.js
      - name: Branding, Creative Fidelity, Marketing and Creative Intelligence together
        run: node --test test/branding*.test.js test/creative-fidelity*.test.js test/marketing*.test.js test/creative-intelligence*.test.js test/creative-critic.test.js test/creative-revision.test.js test/resources*.test.js
      - name: Full suite (cross-domain non-regression)
        run: npm test
