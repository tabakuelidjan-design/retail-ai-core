name: Nordla creative production — offline verification

on:
  pull_request:
    paths:
      - 'src/creative-autonomy/**'
      - 'src/marketing-creative/alibaba/**'
      - 'scripts/creative-autonomy/**'
      - 'scripts/creative-autonomy-trial.mjs'
      - 'scripts/creative-autonomy-report.mjs'
      - 'test/creative-scene.test.js'
      - 'test/creative-product-media.test.js'
      - 'test/creative-shopify-e2e.test.js'
      - 'test/fixtures/creative-autonomy/**'
      - 'src/creative-brain/brief-assessment.js'
      - 'test/helpers/scene_fixtures.py'
      - '.github/workflows/creative-production-v1.yml'
  push:
    branches:
      - feature/creative-production-v1
      - feature/creative-production-v1-scene

permissions:
  contents: read

jobs:
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository dependencies (lockfile)
        run: npm ci --ignore-scripts
      - name: Install the local engines' Python libraries (no Blender needed for the scene path)
        run: python -m pip install numpy pillow scipy
      - name: Scene path end to end with the real Python engines and a simulated provider (no credentials, no network, no cost)
        env:
          NORDLA_PYTHON: python
        run: node --test test/creative-product-media.test.js test/creative-shopify-e2e.test.js test/creative-production.test.js test/creative-scene.test.js test/creative-autonomy.test.js test/creative-autonomy-trial2.test.js test/creative-autonomy-reliability.test.js test/creative-autonomy-eu-model.test.js test/marketing-creative-alibaba.test.js test/marketing-creative-alibaba-image-edit.test.js test/marketing-creative-alibaba-scoped-authorization.test.js test/marketing-creative-alibaba-environment.test.js
      - name: Python source syntax
        run: python -m py_compile scripts/creative-autonomy/compose_stage.py scripts/creative-autonomy/scene_plate.py scripts/creative-autonomy/scene_check.py
