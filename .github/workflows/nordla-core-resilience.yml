name: Nordla Core Resilience

on:
  push:
    branches:
      - feature/nordla-core-resilience-v1
      - claude/nordla-core-p0
    paths:
      - 'src/core-resilience/**'
      - 'benchmarks/core-resilience/**'
      - 'scripts/run-core-chaos.mjs'
      - 'test/core-resilience*.test.js'
      - 'src/creative-brain/**'
      - 'src/creative-brain-benchmark/**'
      - 'docs/architecture/nordla-core-resilience*'
      - '.github/workflows/nordla-core-resilience.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'src/core-resilience/**'
      - 'benchmarks/core-resilience/**'
      - 'scripts/run-core-chaos.mjs'
      - 'test/core-resilience*.test.js'
      - 'docs/architecture/nordla-core-resilience*'
      - 'package.json'

jobs:
  chaos-and-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Core resilience tests
        run: node --test test/core-resilience*.test.js
      - name: Chaos benchmark (fake providers only; no network, no credential)
        run: node scripts/run-core-chaos.mjs
      - name: Whole suite
        # Node 24 only: the repository requires Node >=24 and China Sourcing refuses Node 20, so the whole suite cannot pass on Node 20.
        # Node 20 keeps the core-resilience tests and the chaos benchmark above.
        if: matrix.node == '24'
        run: npm test
