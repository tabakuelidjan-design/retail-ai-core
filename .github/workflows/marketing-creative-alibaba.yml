name: Marketing Creative Alibaba V0

on:
  push:
    branches:
      - feature/marketing-creative-alibaba-v0
    paths:
      - 'src/marketing-creative/alibaba/**'
      - 'test/marketing-creative-alibaba.test.js'
      - 'config/marketing-creative.alibaba.env.example'
      - 'docs/architecture/marketing-creative-alibaba-v0.md'
  pull_request:
    paths:
      - 'src/marketing-creative/alibaba/**'
      - 'test/marketing-creative-alibaba.test.js'
      - 'config/marketing-creative.alibaba.env.example'
      - 'docs/architecture/marketing-creative-alibaba-v0.md'

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node --test test/marketing-creative-alibaba.test.js
