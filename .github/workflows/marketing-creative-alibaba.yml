name: Marketing Creative Alibaba V0

on:
  push:
    branches:
      - feature/marketing-creative-alibaba-v0
    paths:
      - 'src/marketing-creative/alibaba/**'
      - 'test/marketing-creative-alibaba*.test.js'
      - 'src/creative-fidelity/**'
      - 'test/creative-fidelity*.test.js'
      - 'config/marketing-creative.alibaba.env.example'
      - 'docs/architecture/marketing-creative-alibaba*'
      - 'docs/architecture/creative-fidelity*'
      - '.github/workflows/marketing-creative-alibaba.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'src/marketing-creative/alibaba/**'
      - 'test/marketing-creative-alibaba*.test.js'
      - 'src/creative-fidelity/**'
      - 'test/creative-fidelity*.test.js'
      - 'config/marketing-creative.alibaba.env.example'
      - 'docs/architecture/marketing-creative-alibaba*'
      - 'docs/architecture/creative-fidelity*'
      - 'package.json'

jobs:
  pre-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Alibaba targeted
        run: node --test test/marketing-creative-alibaba*.test.js
      - name: Creative Fidelity targeted
        run: node --test test/creative-fidelity*.test.js
      - name: Full repository suite
        run: npm test
