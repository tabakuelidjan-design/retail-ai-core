name: china-sourcing
# China Sourcing only. No secret, no provider, no network call to any provider: the ASR bench uses its fake provider, the tunnel e2e is never run.
on:
  push:
    branches: ['feature/china-sourcing-**']
    paths: ['src/sourcing/**', 'test/sourcing-*', 'test/e2e/**', 'tools/voice-bench/**', 'tools/asr-bench/**', 'package.json', 'package-lock.json', '.github/workflows/china-sourcing.yml']
  pull_request:
    paths: ['src/sourcing/**', 'test/sourcing-*', 'test/e2e/**', 'tools/voice-bench/**', 'tools/asr-bench/**', '.github/workflows/china-sourcing.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci --no-audit --no-fund
      - run: node --test test/sourcing-*.test.js
  e2e:
    # Real-browser suites that need no provider. continue-on-error until they have been observed green on a Linux runner (they were written on Windows/Edge).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --no-audit --no-fund
      - run: npm run sourcing:e2e
        env: { SOURCING_E2E_BROWSER: /usr/bin/google-chrome }
      - run: npm run sourcing:e2e:fieldmode
        env: { SOURCING_E2E_BROWSER: /usr/bin/google-chrome }
      - run: npm run asr:e2e
        env: { SOURCING_E2E_BROWSER: /usr/bin/google-chrome }
