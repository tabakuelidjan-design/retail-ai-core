name: china-sourcing
# China Sourcing only. It requires Node 24 (owner decision 2026-10-12). No secret, no provider, no network call to any provider:
# the ASR bench uses its fake provider and the tunnel e2e is never run.
on:
  push:
    branches: ['feature/china-sourcing-**']
    paths: ['src/sourcing/**', 'test/sourcing-*', 'test/e2e/**', 'tools/voice-bench/**', 'tools/asr-bench/**', 'package.json', 'package-lock.json', '.github/workflows/china-sourcing.yml']
  pull_request:
    paths: ['src/sourcing/**', 'test/sourcing-*', 'test/e2e/**', 'tools/voice-bench/**', 'tools/asr-bench/**', '.github/workflows/china-sourcing.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --no-audit --no-fund
      - run: node --test test/sourcing-*.test.js
  e2e:
    # Real-browser suites that need no provider. INFORMATIONAL (continue-on-error): written on Windows/Edge; on Linux Chromium the fieldmode checks 3, 4 and 18 fail
    # (see docs/CHINA-SOURCING-RUNTIME.md). They must be understood before this job is made blocking.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --no-audit --no-fund
      - run: npm run sourcing:e2e
        env: { SOURCING_E2E_BROWSER: /usr/bin/google-chrome }
      - run: npm run sourcing:e2e:fieldmode
        env: { SOURCING_E2E_BROWSER: /usr/bin/google-chrome }
      - run: npm run asr:e2e
        env: { SOURCING_E2E_BROWSER: /usr/bin/google-chrome }
