name: chantier-d-creative-pole
# Chantier D (branding / marketing / creative pole). Targeted suites, each file in its own process, on Node 20 and 24. Not the whole repository suite: that one runs on integration/**.
# test/social-compat.test.js runs E's REAL code against D's output: chantier E's branch is checked out beside this one (SOCIAL_E_DIR). No secret, no provider, no network.
on:
  push:
    branches: ['feature/chantier-d-**']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  targeted:
    name: targeted (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: feature/social-publishing-e
          path: social-e
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci --no-audit --no-fund
      - name: D suites (asset library, composer, D -> E compatibility) - counted, and failing if any test is skipped
        shell: bash
        env:
          SOCIAL_E_DIR: ${{ github.workspace }}/social-e
        run: |
          test -f "$SOCIAL_E_DIR/src/social/service.js" || { echo "::error title=E checkout missing::the compatibility tests would be skipped"; exit 1; }
          node --test test/asset-library.test.js test/studio-compose.test.js test/social-compat.test.js test/habb-reserve-check.test.js test/studio-ai-layer.test.js | tee /tmp/d.log
          echo "::notice title=D suites (node ${{ matrix.node }})::$(grep -E '^ℹ (tests|pass|fail|skipped)' /tmp/d.log | tr '\n' ' ')"
          grep -q '^ℹ skipped 0' /tmp/d.log || { echo "::error title=skipped::a D test was skipped"; exit 1; }
          if python3 -c "import PIL" 2>/dev/null; then echo "::notice title=jpeg decode check::Pillow present: SC-1 decoded the JPEG"; else echo "::notice title=jpeg decode check::Pillow ABSENT on this runner: SC-1 checked the headers and the size only"; fi
      - name: Branding, Marketing and Creative end-to-end suites (existing modules, unchanged) - counted per file
        shell: bash
        run: |
          fail=0; files=0; tests=0; pass=0; skipped=0
          for f in test/branding*.test.js test/marketing*.test.js test/creative-e2e*.test.js; do
            files=$((files+1))
            timeout 900 node --test "$f" > "/tmp/$(basename "$f").log" 2>&1 || { echo "::error title=failed::$f"; tail -20 "/tmp/$(basename "$f").log"; fail=1; }
            t=$(grep -E '^ℹ tests ' "/tmp/$(basename "$f").log" | awk '{print $3}'); p=$(grep -E '^ℹ pass ' "/tmp/$(basename "$f").log" | awk '{print $3}'); k=$(grep -E '^ℹ skipped ' "/tmp/$(basename "$f").log" | awk '{print $3}')
            tests=$((tests+${t:-0})); pass=$((pass+${p:-0})); skipped=$((skipped+${k:-0}))
          done
          echo "::notice title=Branding/Marketing/Creative e2e (node ${{ matrix.node }})::files=$files tests=$tests pass=$pass skipped=$skipped"
          exit $fail
