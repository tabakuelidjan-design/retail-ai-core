name: nordla-integration-pre-china
# The cross-module integration branch. It merges lines that each have their own workflow, so this job runs the integration tests first (fast diagnosis) and then the suite.
#  - Node 24: the WHOLE suite (China Sourcing requires Node 24, owner decision 2026-10-12: its runtime guard refuses Node 20 with a coded error).
#  - Node 20 (the repository engine floor): the whole suite EXCEPT test/sourcing-* (cannot run on Node 20 by that same decision) and test/growth-browser.test.js (uses the global
#    WebSocket, absent on Node 20: it throws a ReferenceError and then hangs the job where Chrome exists; it runs on Node 24). Nothing else is excluded.
#  - Both versions: each file runs in its own process with its own time cap, 4 at a time, and every failure, hang or slow file is reported as an annotation naming the file,
#    so a stuck file is named (and capped) instead of the whole job being cancelled by the job limit.
# No secret, no provider, no network: every module runs over fakes.
on:
  push:
    branches: ['integration/**', 'claude/nordla-core-p0']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  suite:
    name: full suite (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 20, exclude: '^test/(sourcing-|growth-browser\.test\.js$)' }
          - { node: 24, exclude: '^$' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci --no-audit --no-fund
      - name: Integration contracts and the three cross-module workflows
        run: node --test test/integration-contracts.test.js test/integration-workflows.test.js
      - name: Suite, one process and one cap per file
        shell: bash
        env:
          EXCLUDE: ${{ matrix.exclude }}
        run: |
          one() {
            f="$1"; s=$(date +%s)
            timeout 1500 node --test "$f" > "/tmp/$(basename "$f").log" 2>&1; rc=$?
            d=$(( $(date +%s) - s ))
            echo "$rc $d $f" >> /tmp/results.txt
            if [ "$rc" -ne 0 ]; then echo "::error title=test file failed (exit $rc, ${d}s)::$f :: $(grep -m1 -E '^✖|Error' "/tmp/$(basename "$f").log" | cut -c1-160)"; fi
          }
          export -f one
          : > /tmp/results.txt
          ls test/*.test.js | grep -v -E "$EXCLUDE" | xargs -P 4 -I{} bash -c 'one {}'
          echo "files run: $(wc -l < /tmp/results.txt)"
          sort -k2 -n -r /tmp/results.txt | head -8 | while read rc d f; do echo "::notice title=slowest::$f ${d}s (exit $rc)"; done
          ! grep -q -v '^0 ' /tmp/results.txt
